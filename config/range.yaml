  - {name: "M-7 military range (illustrative)", kind: military, offsets: [[-0.55, -0.25], [-0.35, -0.25], [-0.35, 0.05], [-0.55, 0.05]]}
  - {name: "NFZ-3 no-fly (illustrative)", kind: no_fly, offsets: [[-0.30, -0.60], [-0.18, -0.60], [-0.18, -0.45], [-0.30, -0.45]]}
  - {name: "R-205 offshore danger area (illustrative)", kind: restricted, offsets: [[0.30, 1.20], [0.70, 1.20], [0.70, 1.60], [0.30, 1.60]]}
